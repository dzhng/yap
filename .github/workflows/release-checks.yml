name: Release contract checks
on:
  pull_request:
    paths:
      - .github/workflows/release-checks.yml
      - .node-version
      - helpers/denoise/provenance.json
      - scripts/release*
      - scripts/build-macos.mjs
      - scripts/launcher/**
      - scripts/launcher.test.mjs
      - scripts/sparkle/**
      - packages/core/src/catalog.ts
      - apps/macos/package.json
      - apps/macos/Sources/Yap/ServiceBundle.swift
      - apps/macos/Sources/Yap/NodeRuntime.swift
      - apps/macos/tests/bundled-runtime.test.mjs
      - apps/cli/**
  # Pull requests provide the merge gate; run this manually for post-merge verification.
  workflow_dispatch:
concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      # The launcher's mcp check runs the real CLI, bundled the way a release bundles it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@yap/cli
      - run: node --test scripts/release*.test.mjs scripts/launcher.test.mjs apps/macos/tests/bundled-runtime.test.mjs
