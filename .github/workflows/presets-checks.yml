name: Preset index checks
on:
  pull_request:
    paths:
      - .github/workflows/presets-checks.yml
      - presets/**
      - scripts/presets-index*
      - packages/core/src/preset-format.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/presets-checks.yml
      - presets/**
      - scripts/presets-index*
      - packages/core/src/preset-format.ts
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: --check compares package versions against the merge base with main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node scripts/presets-index.mjs --check
